name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath .
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleRelease
        working-directory: android
      - name: Assinar e nomear o APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks maquina-em-dia.p12 --ks-type PKCS12 --ks-pass pass:maquinaemdia --out Maquina-em-Dia.apk alinhado.apk
          "$BT/apksigner" verify Maquina-em-Dia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Maquina-em-Dia
          path: Maquina-em-Dia.apk
